<app-navbar></app-navbar>
<div class="layout-container">
  <h1 class="welcome-title">Welcome to Le Festin</h1>
  <p class="quote">"Anyone can cook, but only the fearless can be great."</p>
  <div class="signup-container">
    <h2>Login to your account</h2>
    @if(showAlert())
    {
        <div [style.color]="color()">
          {{message()}}
        </div>
    }
    <form (ngSubmit)="onLogin()" class="signup-form" #form="ngForm">
      <label for="email">Email</label>
      <input id="email" type="text" [(ngModel)]="userObject().email" name="email"
        placeholder="Enter your email" required />

      <label for="password">Password</label>
      <input id="password"
       type="password" 
       [(ngModel)]="userObject().password" 
       name="password"
      placeholder="Enter your password" 
      required />

      <button type="submit" class="btn" (click)="onLogin()" [disabled]="isSubmission() || !form.valid">Login</button>

      <p class="redirect">
        Don't have an account?
        <a routerLink="/signup">Sign Up</a>
      </p>
    </form>
  </div>
</div>
