<app-navbar></app-navbar>
<div id="home-container">
    <div id="home">
        <div id="home-meals">
            <h2>Common Meals:</h2>

            <div id="home-meals-grid">
                <div *ngFor="let meal of meals(); let i = index">
                    <app-meal-card 
                    [mealID]="meal.idMeal"
                    [name]="meal.strMeal"
                    [category]="meal.strCategory"
                    [area]="meal.strArea"
                    [img]="meal.strMealThumb"
                    >
                        <!-- <ul id="ingredients">
                            <li *ngFor="let ing of getIngredients(i)">{{i}}. {{ing}}</li>
                        </ul> -->
                    </app-meal-card>
                </div>
            </div>

        </div>
    </div>
    <h2>Meal Categories: </h2>
    <div id="categories">
        <div style="margin-top: 35px" *ngFor="let cat of categories()">
            <div>
                <img [src]="cat.strCategoryThumb"/>
                <br>
                <a>{{cat.strCategory}}</a>
            </div>
        </div>
    </div>
</div>
