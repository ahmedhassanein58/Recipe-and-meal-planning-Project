<app-navbar></app-navbar>
<div id="home-container">
    <app-loading-spinner *ngIf="loading()"></app-loading-spinner>
    <div id="home" *ngIf="!loading()">
        <div id="home-meals">
            <h2>Common Meals:</h2>

            <div id="home-meals-grid">
                <div *ngFor="let meal of meals(); let i = index">
                    @if (meal.publisher == 'admin')
                    {

                        <app-meal-card
                        [mealID]="meal.idMeal"
                        [name]="meal.strMeal"
                        [category]="meal.strCategory"
                        [area]="meal.strArea"
                        [img]="meal.strMealThumb"
                        [publisher]="meal.publisher"
                        >
                            <button class="plan-btn" (click)="planMeal(meal)" [disabled]="!store.user()" title="Plan this meal">
                                📅 Plan
                            </button>
                        </app-meal-card>
                    }
                    @else
                    {
                        <app-meal-card
                        [mealID]="meal.id"
                        [name]="meal.name"
                        [category]="meal.category"
                        [area]="meal.country"
                        [img]="meal.image"
                        [publisher]="meal.publisher"
                        >
                            <button class="plan-btn" (click)="planMeal(meal)" [disabled]="!store.user()" title="Plan this meal">
                                📅 Plan
                            </button>
                        </app-meal-card>
                    }
                </div>
            </div>

        </div>
    </div>
    
    <!-- Plan Meal Dialog -->
    <dialog id="plan-dialog" #planDialog>
        <div class="dialog-header">
            <h2>Plan Your Meal</h2>
            <button class="close-btn" (click)="closeDialog()">&times;</button>
        </div>
        <div class="dialog-content">
            <form>
                <div class="form-group">
                    <label for="planDate">
                        <span class="label-icon">📅</span>
                        Choose a Date:
                    </label>
                    <input type="date" name="planDate" id="planDate" (change)="date = $event.target.valueAsDate" required>
                </div>
                <div class="form-group">
                    <label>
                        <span class="label-icon">🍽️</span>
                        Meal Type:
                    </label>
                    <div id="plan-time">
                        <div class="radio-option">
                            <input type="radio" value="breakfast" [(ngModel)]="type" id="break" name="mealType">
                            <label for="break" class="radio-label">
                                <span class="meal-icon">🌅</span>
                                Breakfast
                            </label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" value="launch" [(ngModel)]="type" id="lunch" name="mealType">
                            <label for="lunch" class="radio-label">
                                <span class="meal-icon">☀️</span>
                                Lunch
                            </label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" value="dinner" [(ngModel)]="type" id="dinner" name="mealType">
                            <label for="dinner" class="radio-label">
                                <span class="meal-icon">🌙</span>
                                Dinner
                            </label>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="dialog-footer">
            <button class="btn-secondary" (click)="closeDialog()">Cancel</button>
            <button class="btn-primary" (click)="complete()">Add to Plan</button>
        </div>
    </dialog>
    
    <div id="categories-section">
        <h2>Explore Meal Categories</h2>
        <p class="categories-subtitle">Discover delicious recipes by category</p>
        <div id="categories">
            <div class="category-card" *ngFor="let cat of categories()" (click)="navigateToCategory(cat.strCategory)">
                <div class="category-image-wrapper">
                    <img [src]="cat.strCategoryThumb" [alt]="cat.strCategory" class="category-image"/>
                    <div class="category-overlay"></div>
                </div>
                <div class="category-info">
                    <h3 class="category-name">{{cat.strCategory}}</h3>
                    <p class="category-description">{{cat.strCategoryDescription}}</p>
                </div>
            </div>
        </div>
    </div>
</div>
