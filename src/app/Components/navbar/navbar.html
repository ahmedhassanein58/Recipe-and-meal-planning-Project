<div id="nav">
    <div class="nav-brand" (click)="goToHome()">🍽️ Le Festin</div>
    <button class="hamburger" (click)="toggleMenu()" [class.active]="menuOpen()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <ul id="nav-list" [class.menu-open]="menuOpen()">
        <li (click)="goToHome(); closeMenu()">Home</li>
        @if(active())
        {
            <li (click)="goToRecipes(); closeMenu()">Recipes</li>
            <li (click)="goToSaved(); closeMenu()">Saved</li>
            <li (click)="goToList(); closeMenu()">Shopping</li>
            <li (click)="goToPlan(); closeMenu()">Planned</li>
            <li (click)="goToProfile(); closeMenu()">Profile</li>
        }
    </ul>
    <ul id="nav-auth" [class.menu-open]="menuOpen()">
        @if(active())
        {
            <button (click)="makeAPost(); closeMenu()">➕ Create Recipe</button>
            <button (click)="onLogout($event); closeMenu()">Logout</button>
        }
        @else
        {
            <button (click)="goToLogin(); closeMenu()">Sign In</button>
        }
    </ul>
    <!-- Mobile menu wrapper - only visible on mobile -->
    <div class="mobile-menu-container" [class.menu-open]="menuOpen()">
        <ul class="mobile-nav-list">
            <li (click)="goToHome(); closeMenu()">Home</li>
            @if(active())
            {
                <li (click)="goToRecipes(); closeMenu()">Recipes</li>
                <li (click)="goToSaved(); closeMenu()">Saved</li>
                <li (click)="goToList(); closeMenu()">Shopping</li>
                <li (click)="goToPlan(); closeMenu()">Planned</li>
                <li (click)="goToProfile(); closeMenu()">Profile</li>
            }
        </ul>
        <ul class="mobile-nav-auth">
            @if(active())
            {
                <button (click)="makeAPost(); closeMenu()">➕ Create Recipe</button>
                <button (click)="onLogout($event); closeMenu()">Logout</button>
            }
            @else
            {
                <button (click)="goToLogin(); closeMenu()">Sign In</button>
            }
        </ul>
    </div>
</div>
