<div id="nav">
    <ul id="nav-list">
        <li (click)="goToHome()">Home</li>
        @if(active())
        {
            <li>Recipies</li>
            <li (click)="goToSaved()">Saved Recipes</li>
            <li>Shopping List</li>
            <li>Planned</li>
            <li>Profile</li>
        }
      
        
        
        
        <ul id="nav-auth">
            @if(active())
            {
                <button  (click)="onLogout($event)">Logout</button>
            }
            @else
            {
                <button (click)="goToLogin()">Signin/Login</button>
            }
        </ul>
    </ul>
</div>
