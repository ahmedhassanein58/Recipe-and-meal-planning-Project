<div class="toast" [class.visible]="visible()" [class.success]="type() === 'success'" [class.error]="type() === 'error'" [class.warning]="type() === 'warning'" [class.info]="type() === 'info'">
    <div class="toast-content">
        <span class="toast-icon">{{getIcon()}}</span>
        <span class="toast-message">{{message()}}</span>
        <button class="toast-close" (click)="hide()">&times;</button>
    </div>
</div>
